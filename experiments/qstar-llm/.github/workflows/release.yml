name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Run unit tests
        run: zig build test

      - name: Generate minimal corpus for CI
        run: |
          echo "Qstar-LLM is a lattice-native inference engine." > qstar_corpus.txt
          echo "The lattice is a 15x15x15 grid of 421 E0 nodes with 7 channels." >> qstar_corpus.txt
          echo "All arithmetic uses i64 Q32.32 fixed-point — no floating-point in state paths." >> qstar_corpus.txt
          echo "Zero external dependencies beyond libc." >> qstar_corpus.txt
          echo "The agent state is 23,576 bytes (23 KB)." >> qstar_corpus.txt

      - name: Build compressed corpus
        run: zig build corpus

      - name: Build WASM module
        run: zig build wasm

      - name: Build self-contained universe.html
        run: zig build html

      - name: Run master gate (regression + build + publish payloads)
        run: zig build master

      - name: Verify seed manifest
        run: |
          test -f zig-out/master/seed_manifest.json || { echo "FAIL: no seed_manifest.json"; exit 1; }
          grep -q '"version"' zig-out/master/seed_manifest.json || { echo "FAIL: manifest missing version"; exit 1; }
          grep -q '"wasm_sha256"' zig-out/master/seed_manifest.json || { echo "FAIL: manifest missing wasm_sha256"; exit 1; }
          echo "OK: seed manifest valid"

      - name: Verify published payloads
        run: |
          for f in universe.html qstar_corpus.qsc qstar_corpus_distilled.txt qstar_llm.wasm seed_manifest.json; do
            test -f zig-out/master/$f || { echo "FAIL: missing $f"; exit 1; }
          done
          echo "OK: all 5 payloads published"

      - name: Generate P2P index
        run: |
          zig build cli -- master publish-p2p
          test -f zig-out/master/p2p_index.json || { echo "FAIL: no p2p_index.json"; exit 1; }
          echo "OK: p2p_index.json valid"

      - name: Archive artifacts
        run: |
          mkdir -p artifacts
          cp zig-out/master/seed_manifest.json artifacts/
          cp zig-out/master/universe.html artifacts/
          cp zig-out/master/qstar_corpus_distilled.txt artifacts/
          cp zig-out/master/qstar_llm.wasm artifacts/
          cp zig-out/master/p2p_index.json artifacts/
          if [ -f zig-out/master/qstar_corpus.qsc ]; then
            cp zig-out/master/qstar_corpus.qsc artifacts/
          fi
          cd artifacts && tar czf ../qstar-release-${{ github.ref_name }}.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qstar-release-${{ github.ref_name }}
          path: artifacts/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: qstar-release-${{ github.ref_name }}
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Qstar-LLM ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
            artifacts/qstar-release-${{ github.ref_name }}.tar.gz
          body: |
            ## Qstar-LLM ${{ github.ref_name }}

            ### Artifacts
            - `universe.html` — self-contained quine edition (WASM + distilled corpus)
            - `qstar_llm.wasm` — WASM binary (capabilities/tools)
            - `qstar_corpus_distilled.txt` — distilled text corpus
            - `seed_manifest.json` — update manifest (version + SHA-256 hashes)
            - `p2p_index.json` — P2P mesh routing index

            ### Install
            ```bash
            # Clone
            git clone https://github.com/ostffleetadmiral/qstar-ecosystem.git
            cd qstar-ecosystem

            # Build
            zig build

            # Run tests
            zig build test
            ```
